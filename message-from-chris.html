<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typewriter</title>
      <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>

        function gtag() { dataLayer.push(arguments); }

<style>
:root{--stage:#ebe8df;--ink:#1c1b18;--mute:#77736a;--line:#d9d5c8;--acc:#1c1b18;--accfg:#fff;--dot:#cfcabb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stage:#131311;--ink:#ece9df;--mute:#8d897d;--line:#2a2a26;--acc:#ece9df;--accfg:#111;--dot:#26261f}}
:root[data-theme="dark"]{--stage:#131311;--ink:#ece9df;--mute:#8d897d;--line:#2a2a26;--acc:#ece9df;--accfg:#111;--dot:#26261f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{height:100%;position:relative;display:flex;align-items:center;justify-content:center;padding:24px 24px 72px;
background:var(--stage) radial-gradient(var(--dot) 1px,transparent 1px) 0 0/22px 22px;outline:none}
#svg{width:100%;max-width:920px;max-height:100%;height:auto;cursor:text;touch-action:manipulation}
.key{transition:transform .06s}.key.pr{transform:translateY(3px)}.key.pr rect,.key.pr circle{fill:#e7b84a}
.vib{animation:v .08s}@keyframes v{50%{transform:translateY(2px)}}
.ib{position:absolute;top:12px;width:34px;height:34px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:transparent;color:var(--mute);opacity:.55;cursor:pointer;transition:opacity .15s,color .15s,background .15s}
.ib:hover,.ib:focus-visible{opacity:1;color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent);outline:none}
.ib:disabled{opacity:.3;cursor:default}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#snd{left:12px}#exp{right:12px}
</style>
</head>
<body>
<main id="stage" tabindex="0">
<svg id="svg" viewBox="0 0 600 470" role="img" aria-label="Playable typewriter">
<defs>
<clipPath id="win"><rect x="90" y="8" width="420" height="140"/></clipPath>
<linearGradient id="pl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#555"/><stop offset=".35" stop-color="#2b2b2b"/><stop offset="1" stop-color="#111"/></linearGradient>
</defs>
<g clip-path="url(#win)"><g id="paper" style="transform:translate(0,140px);transition:transform .12s ease-out">
<rect id="sheet" x="-60" y="-110" width="500" height="200" fill="#fbfaf3" stroke="#00000022"/>
<g id="ink" font-family="'Courier New',Courier,monospace" font-size="16" fill="#26241f" text-anchor="middle"></g></g></g>
<rect x="88" y="146" width="424" height="26" rx="13" fill="url(#pl)"/>
<circle cx="80" cy="159" r="14" fill="#222"/><circle cx="520" cy="159" r="14" fill="#222"/>
<circle cx="80" cy="159" r="7" fill="#555"/><circle cx="520" cy="159" r="7" fill="#555"/>
<g id="lever" style="transform-origin:76px 150px;transition:transform .15s"><path d="M76 150 L30 128" stroke="#222" stroke-width="5" stroke-linecap="round"/><circle cx="28" cy="127" r="6" fill="#222"/></g>
<g id="bars"></g>
<g id="rib"><path d="M225 192 L272 182 H328 L375 192" stroke="#1a1a1a" stroke-width="3" fill="none"/><rect id="rg" x="276" y="178" width="48" height="5" rx="2" fill="#c9302c"/></g>
<g id="spools"><circle id="sl" cx="225" cy="198" r="14" fill="#2b2b2b"/><circle id="sr" cx="375" cy="198" r="14" fill="#2b2b2b"/><path d="M225 186v24M213 198h24M375 186v24M363 198h24" stroke="#777" stroke-width="2"/></g>
<path id="body" d="M120 245 H480 L545 435 Q548 458 525 458 H75 Q52 458 55 435 Z"/>
<path id="deck" d="M120 245 H480 L486 262 H114 Z"/>
<g id="plate"><rect x="235" y="268" width="130" height="18" rx="4" fill="#d8c27a"/><text id="lbl" x="300" y="281" text-anchor="middle" font-size="10" font-family="Georgia,serif" letter-spacing="2" fill="#2a2415"></text></g>
<g id="keys"></g>
</svg>
<button class="ib" id="snd" title="Sound on/off" aria-label="Sound on/off" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><g class="on"><path d="M15.5 9.5a3.5 3.5 0 010 5M18 7a7 7 0 010 10"/></g><g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button>
<button class="ib" id="exp" title="Export" aria-label="Export animation"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg></button>
</main>
<script>
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
/* ================= CONFIG: edit values here ================= */
const P={
  color:"#8EC3B5",        // body enamel
  text:"Dear friend,\nI did everything\nI could to improve\nthe Monopoly\nand I think it works\na little better now\non smaller devices.\nThanks for keeping\nan eye on it.\n\nChris", // \n = line break
  speed:12,               // characters per second
  humanize:true,          // uneven rhythm
  jitter:.3,              // 0-1
  columns:32,             // 16-60
  loop:true,
  hold:2600,              // ms before looping
  startDelay:600,         // ms
  sound:false,            // plays after the first click / key press
  interactive:true,       // click it and type
  label:""                // nameplate text
};
const EXPORT={
  format:"video", // "video" | "gif": what the export button produces
  auto:null,   // null | "video" | "gif": export once automatically on load
  width:720,   // 480 | 720 | 1080 (GIF is capped at 720)
  bg:"auto",   // "auto" = same as the page (follows light/dark mode), or a hex like "#ebe8df"
  dots:true    // draw the dotted grid like the page
};
/* ============================================================ */
const CW=9.6,LH=22,SX=300;let line=0,col=0,runId=0,seq=[],cells=new Map(),ac=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const setStatus=()=>{};

/* ---- build machine ---- */
const shade=(p)=>`color-mix(in srgb, ${P.color} ${p}%, black)`;
function paint(){const b=$("body"),d=$("deck");b.style.fill=P.color;b.style.stroke=shade(60);b.setAttribute("stroke-width",2);d.style.fill=shade(70);$("sl").style.fill=$("sr").style.fill="#2b2b2b";
$("lbl").textContent=P.label;$("plate").style.display=P.label?"":"none"}
const BN=15,bars=[];
for(let i=0;i<BN;i++){const bx=200+i*(200/(BN-1)),rx=SX+(bx-SX)*.9,ry=212+Math.abs(i-7)*2;
const g=el("g",{},$("bars")),l=el("line",{x1:bx,y1:262,x2:rx,y2:ry,stroke:"#b9b9b9","stroke-width":3,"stroke-linecap":"round"},g),s=el("rect",{width:8,height:9,rx:1.5,fill:"#2a2a2a"},g);
bars.push({bx,rx,ry,l,s,t:-1});place(bars[i],0)}
function place(b,p){const x=b.rx+(SX-b.rx)*p,y=b.ry+(172-b.ry)*p;b.l.setAttribute("x2",x);b.l.setAttribute("y2",y);b.s.setAttribute("x",x-4);b.s.setAttribute("y",y-5)}
const keyEls={};
[["1234567890",298],["QWERTYUIOP",330],["ASDFGHJKL",362],["ZXCVBNM",394]].forEach(([r,y])=>{const x0=SX-(r.length-1)*17;
[...r].forEach((c,i)=>{const g=el("g",{class:"key"},$("keys")),x=x0+i*34;
el("circle",{cx:x,cy:y,r:14,fill:"#f1ede2",stroke:"#222","stroke-width":2},g);
const t=el("text",{x,y:y+4,"text-anchor":"middle","font-size":11,"font-family":"system-ui,sans-serif",fill:"#222"},g);t.textContent=c;keyEls[c]=g})});
{const g=el("g",{class:"key"},$("keys"));el("rect",{x:200,y:414,width:200,height:20,rx:10,fill:"#f1ede2",stroke:"#222","stroke-width":2},g);keyEls[" "]=g}

/* ---- paper / state ---- */
function carriage(){$("paper").style.transform=`translate(${SX-CW/2-col*CW}px,${140-line*LH}px)`;
const w=Math.max(P.columns*CW+140,300);$("sheet").setAttribute("width",w);$("sheet").setAttribute("height",110+(line+3)*LH);
$("spools").style.transform="";$("sl").setAttribute("r",14+Math.min(col,60)*.04);$("sr").setAttribute("r",14-Math.min(col,60)*.04)}
function reset(){$("ink").innerHTML="";cells.clear();line=0;col=0;carriage()}
function pressKey(ch){const k=keyEls[ch.toUpperCase()];if(k){k.classList.add("pr");setTimeout(()=>k.classList.remove("pr"),90)}
const b=bars[(ch.charCodeAt(0)*7)%BN];b.t=performance.now()}
function anim(now){for(const b of bars){if(b.t<0)continue;const t=(now-b.t)/120;if(t>=1){b.t=-1;place(b,0);continue}
const p=t<.5?t*2:2-t*2;place(b,p*p*(3-2*p))}requestAnimationFrame(anim)}requestAnimationFrame(anim);
function strike(ch){if(col>=P.columns)newline();
if(ch!==" "){const t=el("text",{x:col*CW+CW/2,y:line*LH,opacity:.9+Math.random()*.1},$("ink"));t.textContent=ch;t.setAttribute("transform",`rotate(${(Math.random()-.5)*1.6} ${col*CW} ${line*LH})`);cells.set(line+","+col,t)}
col++;carriage();pressKey(ch);const r=$("rg");r.classList.remove("vib");void r.getBoundingClientRect();r.classList.add("vib");click()}
function newline(){line++;col=0;carriage();const l=$("lever");l.style.transform="rotate(-14deg)";setTimeout(()=>l.style.transform="",160);ding()}

/* ---- sound ---- */
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume()}
function click(){if(!P.sound||!ac)return;const n=ac.sampleRate*.04,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=ac.createBufferSource();s.buffer=b;
const f=ac.createBiquadFilter();f.type="bandpass";f.frequency.value=1800+Math.random()*900;const g=ac.createGain();g.gain.value=.5;s.connect(f).connect(g).connect(ac.destination);s.start()}
function ding(){if(!P.sound||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=2093;g.gain.setValueAtTime(.25,ac.currentTime);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.9);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.9)}

/* ---- text layout + playback ---- */
function layout(text,cols){const out=[];for(const para of text.split("\n")){let ln="";for(let w of para.split(" ")){
while(w.length>cols){if(ln){out.push(ln);ln=""}out.push(w.slice(0,cols));w=w.slice(cols)}
if(!ln)ln=w;else if((ln+" "+w).length<=cols)ln+=" "+w;else{out.push(ln);ln=w}}out.push(ln)}return out}
function build(){const ls=layout(P.text,P.columns);seq=[];ls.forEach((l,i)=>{for(const c of l)seq.push(c);if(i<ls.length-1)seq.push("\n")})}
async function play(){const id=++runId;build();reset();setStatus("Waiting…");await sleep(P.startDelay);if(id!==runId)return;setStatus("Typing…");
for(const ch of seq){if(id!==runId)return;ch==="\n"?newline():strike(ch);let d=1000/P.speed;
if(P.humanize){d*=1+(Math.random()*2-1)*P.jitter;if(ch===" ")d*=1.3;if(".,;!?".includes(ch))d*=1.8;if(ch==="\n")d*=2.2}await sleep(d)}
if(id!==runId)return;setStatus("Done — onDone() fired");console.log("typed");
if(P.loop){await sleep(P.hold);if(id===runId)play()}}

/* ---- interactive typing ---- */
$("stage").addEventListener("pointerdown",()=>{audio();$("stage").focus()});
$("stage").addEventListener("keydown",e=>{if(!P.interactive||e.metaKey||e.ctrlKey||e.altKey)return;
const k=e.key;if(k.length===1||k==="Enter"||k==="Backspace"){e.preventDefault();audio();
if(runId>=0&&!e.repeat||true){const was=runId;runId++;if(was!==runId)setStatus("Manual typing")}
if(k==="Enter")newline();else if(k==="Backspace"){if(col>0){col--;const c=cells.get(line+","+col);c&&c.remove();cells.delete(line+","+col);carriage();pressKey(" ")}}
else strike(k)}});

/* ---- export (machine only -> video / gif) ---- */
const NSX="http://www.w3.org/2000/svg",hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),note=s=>console.log("[export]",s),toHex=c=>"#"+c.match(/\d+/g).slice(0,3).map(n=>(+n).toString(16).padStart(2,"0")).join("");
const frameSvg=(w,h)=>{const c=$("svg").cloneNode(true);c.setAttribute("xmlns",NSX);c.setAttribute("viewBox","-20 0 640 470");c.setAttribute("width",w);c.setAttribute("height",h);
for(const id of["paper","lever","rg"]){const e=c.querySelector("#"+id);e.style.transition="none";e.style.animation="none";e.style.transform=getComputedStyle($(id)).transform}
const s=document.createElementNS(NSX,"style");s.textContent=".key.pr{transform:translateY(3px)}.key.pr rect,.key.pr circle{fill:#e7b84a}";c.prepend(s);
return"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(c))};
const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
function mkPal(d,extra){const m=new Map();for(let i=0;i<d.length;i+=4){const k=(d[i]>>3<<10)|(d[i+1]>>3<<5)|(d[i+2]>>3);m.set(k,(m.get(k)||0)+1)}
return[...m].sort((a,b)=>b[1]-a[1]).slice(0,256-extra.length).map(([k])=>[(k>>10&31)<<3|4,(k>>5&31)<<3|4,(k&31)<<3|4]).concat(extra)}
function toIdx(d,pal,cache){const o=new Uint8Array(d.length/4);for(let i=0,j=0;i<d.length;i+=4,j++){const r=d[i],g=d[i+1],b=d[i+2],k=(r>>3<<10)|(g>>3<<5)|(b>>3);let v=cache.get(k);
if(v===undefined){let bd=1e9;v=0;for(let p=0;p<pal.length;p++){const q=pal[p],e=(q[0]-r)**2+(q[1]-g)**2+(q[2]-b)**2;if(e<bd){bd=e;v=p}}cache.set(k,v)}o[j]=v}return o}
function lzw(px){const o=[];let cur=0,nb=0,size=9,next=258;const dict=new Map();
const em=c=>{cur|=c<<nb;nb+=size;while(nb>=8){o.push(cur&255);cur>>=8;nb-=8}};em(256);let pre=px[0];
for(let i=1;i<px.length;i++){const c=px[i],k=pre*256+c,v=dict.get(k);if(v!==undefined){pre=v;continue}em(pre);
if(next<4096){dict.set(k,next++);if(next>(1<<size)&&size<12)size++}else{em(256);dict.clear();next=258;size=9}pre=c}
em(pre);em(257);if(nb>0)o.push(cur&255);return Uint8Array.from(o)}
function gif(frames,w,h,pal,dl){const b=[],W=v=>b.push(v&255,v>>8&255),S=s=>[...s].forEach(c=>b.push(c.charCodeAt(0)));
S("GIF89a");W(w);W(h);b.push(0xF7,0,0);for(let i=0;i<256;i++)b.push(...(pal[i]||[0,0,0]));
b.push(0x21,0xFF,11);S("NETSCAPE2.0");b.push(3,1,0,0,0);
frames.forEach((f,n)=>{b.push(0x21,0xF9,4,4);W(dl[n]);b.push(0,0,0x2C);W(0);W(0);W(w);W(h);b.push(0,8);
const d=lzw(f);for(let i=0;i<d.length;i+=255){const c=d.subarray(i,i+255);b.push(c.length);for(const x of c)b.push(x)}b.push(0)});b.push(0x3B);return new Uint8Array(b)}
async function saveFile(name,blob){let d=null;try{d=await window.claude?.use("downloads")}catch(e){}
if(d){try{await d.save({filename:name,data:blob});return"Saved "+name}catch(e){return e.code==="declined"?"Export cancelled":"Couldn't save: "+(e.code||e.message)}}
const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();return"Downloaded "+name}
let exporting=false;
async function exportAnim(fmt){if(exporting)return;exporting=true;const btn=[],bg=EXPORT.bg==="auto"?toHex(getComputedStyle($("stage")).backgroundColor):EXPORT.bg,prev=P.loop;
let w=EXPORT.width;if(fmt==="gif")w=Math.min(w,720);const h=Math.round(w*470/640);
const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d",{willReadFrequently:true});
const bgc=document.createElement("canvas");bgc.width=w;bgc.height=h;{const g=bgc.getContext("2d");g.fillStyle=bg;g.fillRect(0,0,w,h);
if(EXPORT.dots){const k=w/($("svg").getBoundingClientRect().width*640/600),sp=22*k;g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--dot").trim()||"#cfcabb";
for(let y=0;y<h;y+=sp)for(let x=0;x<w;x+=sp){g.beginPath();g.arc(x,y,k,0,6.2832);g.fill()}}}
P.loop=false;btn.forEach(b=>b.disabled=true);let msg="",timer;
try{let rec,mime="";const chunks=[],frames=[],ts=[],cache=new Map();let pal=null,busy=false;
if(fmt==="video"){mime=["video/mp4;codecs=avc1","video/webm;codecs=vp9","video/webm"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
if(!mime)throw new Error("video recording isn't supported in this browser, try GIF");
rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:8e6});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start()}
const grab=async()=>{if(busy)return;busy=true;try{const t=performance.now(),im=await loadImg(frameSvg(w,h));cx.drawImage(bgc,0,0);cx.drawImage(im,0,0,w,h);
if(fmt==="gif"){const d=cx.getImageData(0,0,w,h).data;if(!pal)pal=mkPal(d,[bg,"#e7b84a","#26241f","#fbfaf3","#c9302c","#222222","#2b2b2b",P.color].map(hex));frames.push(toIdx(d,pal,cache));ts.push(t)}}catch(e){}busy=false};
note("Recording…");const run=play();await grab();timer=setInterval(grab,fmt==="gif"?66:33);await run;await sleep(900);clearInterval(timer);
let blob,name;
if(fmt==="video"){await new Promise(r=>{rec.onstop=r;rec.stop()});blob=new Blob(chunks,{type:mime.split(";")[0]});name="typewriter."+(mime.includes("mp4")?"mp4":"webm")}
else{if(!frames.length)throw new Error("no frames captured");note("Encoding GIF…");await sleep(30);const dl=ts.map((t,i)=>Math.max(2,Math.round(((ts[i+1]??t+100)-t)/10)));blob=new Blob([gif(frames,w,h,pal,dl)],{type:"image/gif"});name="typewriter.gif"}
msg=await saveFile(name,blob)}
catch(e){msg="Export failed: "+e.message}
finally{clearInterval(timer);P.loop=prev;btn.forEach(b=>b.disabled=false);exporting=false;play();note(msg)}}
window.exportTypewriter=fmt=>{audio();return exportAnim(fmt||EXPORT.format)}; // call from code or the console: exportTypewriter("gif")
paint();play();
if(EXPORT.auto)exportTypewriter(EXPORT.auto);
{const sb=$("snd"),xb=$("exp"),sync=()=>{sb.setAttribute("aria-pressed",P.sound);sb.querySelector(".on").style.display=P.sound?"":"none";sb.querySelector(".off").style.display=P.sound?"none":""};
sb.onkeydown=xb.onkeydown=e=>e.stopPropagation();
sb.onclick=e=>{e.stopPropagation();P.sound=!P.sound;if(P.sound)audio();sync()};
xb.onclick=async e=>{e.stopPropagation();xb.disabled=true;try{await exportTypewriter()}finally{xb.disabled=false}};sync()}
</script>
</body>
</html>
