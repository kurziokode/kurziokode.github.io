<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ζελέ Αλφάβητο</title>
  <style>
.stage,.table{top:0;left:0;right:0;bottom:0}.strip input{top:0;left:0}
h1{font:700 16px/.92 var(--round)}.hint{font:700 14px/1.2 var(--round)}
.bar{padding:14px 20px 0}.row{padding:0 20px}.dock{padding-bottom:16px}
@supports not (gap:1px){.brand>*+*{margin-left:14px}.cubes>*+*{margin-left:7px}.tools>*+*{margin-left:8px}.row>*+*{margin-left:18px}.candies>*+*{margin-left:28px}.dock>*+*{margin-top:10px}}
</style>
<style>
    :root {
      --pink: #FF2E7E;
      --pink-deep: #EC1668;
      --lemon: #FFE14D;
      --grape: #2B1055;
      --white: #FFFFFF;
      --lime: #7CFF6B;
      --blue: #3DA5FF;
      --orange: #FF8A1F;
      --round: "Arial Rounded MT Bold", "Arial Rounded MT", "Varela Round", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif;
      --spring: cubic-bezier(.3, 1.7, .5, 1);
      --squish: cubic-bezier(.2, 1.9, .4, .9);
      --soft: cubic-bezier(.22, .9, .3, 1);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: var(--pink);
      color: var(--grape);
      font-family: var(--round);
      font-weight: 700;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--pink)
    }

    .table {
      position: absolute;
      inset: 0
    }

    .table.jolt {
      animation: jolt .62s var(--soft)
    }

    @keyframes jolt {
      0% {
        transform: translate(0, 0) rotate(0)
      }

      12% {
        transform: translate(-3px, -11px) rotate(-.35deg)
      }

      30% {
        transform: translate(4px, 7px) rotate(.3deg)
      }

      48% {
        transform: translate(-3px, -4px) rotate(-.18deg)
      }

      66% {
        transform: translate(2px, 2px) rotate(.1deg)
      }

      100% {
        transform: translate(0, 0) rotate(0)
      }
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    #fg {
      touch-action: none;
      cursor: default
    }

    /* ---------- top bar ---------- */
    .bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      z-index: 3;
      pointer-events: none;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: calc(14px + env(safe-area-inset-top)) clamp(12px, 2.2vw, 28px) 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.4vw, 18px)
    }

    h1 {
      margin: 0;
      font: 700 clamp(14px, 1.25vw, 18px)/.92 var(--round);
      letter-spacing: -.01em;
      text-transform: lowercase;
      color: var(--grape);
    }

    h1 span {
      display: block
    }

    .cubes {
      display: flex;
      gap: 7px;
      pointer-events: auto;
      padding: 4px 2px
    }

    .cube {
      --c: var(--lemon);
      --d: #F09600;
      position: relative;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 2.5px solid var(--grape);
      border-radius: 9px;
      background: linear-gradient(155deg, var(--c) 35%, var(--d) 130%);
      box-shadow: inset 0 -5px 0 rgba(43, 16, 85, .16), 0 3px 0 rgba(43, 16, 85, .32);
      cursor: pointer;
      transform: rotate(var(--tilt, 0deg));
      transition: transform .45s var(--spring), box-shadow .3s var(--soft);
    }

    .cube::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 11px;
      height: 5px;
      border-radius: 5px;
      background: #fff;
      opacity: .9;
      transform: rotate(-18deg)
    }

    .cube::after {
      content: "";
      position: absolute;
      right: 4px;
      bottom: 5px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff;
      opacity: .55
    }

    .cube:nth-child(1) {
      --tilt: -5deg
    }

    .cube:nth-child(2) {
      --c: var(--lime);
      --d: #12B43C;
      --tilt: 4deg
    }

    .cube:nth-child(3) {
      --c: var(--blue);
      --d: #145ADC;
      --tilt: -3deg
    }

    .cube:nth-child(4) {
      --c: var(--orange);
      --d: #E63C0A;
      --tilt: 6deg
    }

    .cube:hover {
      transform: rotate(calc(var(--tilt) * -1.6)) scale(1.14, 1.06)
    }

    .cube:active {
      transform: scale(1.22, .78) translateY(3px)
    }

    .cube[aria-pressed="true"] {
      transform: translateY(-6px) rotate(calc(var(--tilt) * -2)) scale(1.12);
      box-shadow: inset 0 -5px 0 rgba(43, 16, 85, .16), 0 9px 0 -2px rgba(43, 16, 85, .3), 0 0 0 3px #fff
    }

    .tools {
      display: flex;
      gap: 8px;
      pointer-events: auto
    }

    .tool {
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--grape);
      color: var(--lemon);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .28), inset 0 3px 0 rgba(255, 255, 255, .14), 0 4px 0 rgba(43, 16, 85, .3);
      transition: transform .4s var(--spring);
    }

    .tool:hover {
      transform: scale(1.12, 1.04) rotate(-4deg)
    }

    .tool:active {
      transform: scale(1.2, .8) translateY(3px)
    }

    .tool svg {
      width: 24px;
      height: 24px;
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .tool .ar {
      transform-origin: 12px 12px;
      transition: transform .6s var(--spring), opacity .25s
    }

    .tool .zg {
      transform-origin: 12px 12px;
      opacity: 0;
      transform: scale(.2);
      transition: transform .6s var(--spring), opacity .25s
    }

    .tool[data-g="1"] .ar {
      transform: rotate(180deg)
    }

    .tool[data-g="2"] .ar {
      opacity: 0;
      transform: rotate(270deg) scale(.2)
    }

    .tool[data-g="2"] .zg {
      opacity: 1;
      transform: scale(1)
    }

    .tool[data-g="2"] .zg circle:nth-child(2) {
      animation: orbit 3.2s linear infinite;
      transform-origin: 12px 12px
    }

    @keyframes orbit {
      to {
        transform: rotate(360deg)
      }
    }

    .tool .wave {
      opacity: 0;
      transition: opacity .25s
    }

    .tool .mute {
      transition: opacity .25s
    }

    .tool[aria-pressed="true"] {
      color: var(--lime)
    }

    .tool[aria-pressed="true"] .wave {
      opacity: 1
    }

    .tool[aria-pressed="true"] .mute {
      opacity: 0
    }

    .tool .wig {
      transform-origin: 12px 8px
    }

    .tool:hover .wig {
      animation: wig .5s var(--soft)
    }

    @keyframes wig {
      30% {
        transform: translateX(-2px) scaleX(1.15)
      }

      60% {
        transform: translateX(2px) scaleX(.9)
      }
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px
    }

    .cube:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px
    }

    /* ---------- bottom dock ---------- */
    .dock {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 0 0 calc(16px + env(safe-area-inset-bottom));
    }

    .hint {
      margin: 0;
      min-height: 18px;
      font: 700 clamp(13px, 1.05vw, 15px)/1.2 var(--round);
      letter-spacing: .015em;
      text-transform: lowercase;
      color: var(--grape);
      opacity: 0;
      transform: translateY(10px) scale(.9);
      transition: opacity .35s var(--soft), transform .7s var(--spring);
    }

    .hint.on {
      opacity: 1;
      transform: none
    }

    .hint i {
      font-style: normal;
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lemon);
      box-shadow: 0 0 0 2px var(--grape);
      margin: 0 9px 1px 0;
      vertical-align: middle
    }

    .row {
      display: flex;
      align-items: center;
      gap: 18px;
      max-width: 100%;
      padding: 0 clamp(12px, 2.2vw, 28px)
    }

    .wrap {
      position: relative;
      flex: none;
      pointer-events: auto;
      filter: drop-shadow(0 4px 0 rgba(43, 16, 85, .32));
      transition: transform .45s var(--spring)
    }

    .wrap:focus-within {
      transform: scale(1.04) rotate(-1deg)
    }

    .strip {
      display: block;
      position: relative;
      width: 264px;
      height: 46px;
      background:
        repeating-linear-gradient(115deg, var(--pink) 0 5px, transparent 5px 11px) left center/30px 100% no-repeat,
        repeating-linear-gradient(65deg, var(--pink) 0 5px, transparent 5px 11px) right center/30px 100% no-repeat,
        #fff;
      clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 12.5%, 100% 25%, calc(100% - 7px) 37.5%, 100% 50%, calc(100% - 7px) 62.5%, 100% 75%, calc(100% - 7px) 87.5%, 100% 100%, 0 100%, 7px 87.5%, 0 75%, 7px 62.5%, 0 50%, 7px 37.5%, 0 25%, 7px 12.5%);
    }

    .strip::after {
      content: "";
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 7px;
      height: 3px;
      border-radius: 2px;
      background: var(--grape);
      opacity: .14;
      transition: opacity .2s, transform .5s var(--spring);
      transform: scaleX(.6)
    }

    .wrap:focus-within .strip::after {
      opacity: 1;
      transform: scaleX(1)
    }

    .strip input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      outline: none;
      padding: 0 33px 3px;
      text-align: center;
      font: 700 16px/1 var(--round);
      letter-spacing: .06em;
      color: var(--grape);
      text-transform: uppercase;
      caret-color: var(--pink);
      -webkit-user-select: text;
      user-select: text;
      border-radius: 0;
    }

    .strip input::placeholder {
      color: var(--grape);
      opacity: .5;
      letter-spacing: .04em;
      text-transform: lowercase
    }

    .wrap:focus-within {
      outline: 3px solid #fff;
      outline-offset: 4px;
      border-radius: 4px
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%)
    }

    .candies {
      display: flex;
      gap: 28px;
      padding: 8px 16px 10px;
      pointer-events: auto;
      overflow-x: auto;
      scrollbar-width: none;
      touch-action: pan-x;
      overscroll-behavior: contain;
    }

    .candies::-webkit-scrollbar {
      display: none
    }

    .candy {
      --c: var(--lemon);
      position: relative;
      flex: none;
      height: 44px;
      padding: 0 17px 2px;
      border: 0;
      border-radius: 15px;
      background: var(--c);
      font: 700 17px/1 var(--round);
      letter-spacing: .02em;
      color: var(--grape);
      text-transform: lowercase;
      cursor: pointer;
      box-shadow: inset 0 -5px 0 rgba(43, 16, 85, .17), inset 0 3px 0 rgba(255, 255, 255, .6), 0 4px 0 rgba(43, 16, 85, .32);
      transform: rotate(var(--tilt, 0deg));
      transition: transform .5s var(--spring);
    }

    .candy::before,
    .candy::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 17px;
      height: 30px;
      margin-top: -15px;
      background: var(--c);
      clip-path: polygon(100% 50%, 0 0, 28% 50%, 0 100%);
      filter: brightness(.93);
    }

    .candy::before {
      left: -13px
    }

    .candy::after {
      right: -13px;
      transform: scaleX(-1)
    }

    .candy:nth-child(4n+2) {
      --c: var(--lime)
    }

    .candy:nth-child(4n+3) {
      --c: var(--blue)
    }

    .candy:nth-child(4n) {
      --c: var(--orange)
    }

    .candy:nth-child(odd) {
      --tilt: -2.5deg
    }

    .candy:nth-child(even) {
      --tilt: 2deg
    }

    .candy:hover {
      transform: rotate(calc(var(--tilt) * -2.4)) scale(1.1, 1.04) translateY(-3px)
    }

    .candy:active {
      transform: scale(1.16, .8) translateY(3px)
    }

    @media (max-width:1380px) {
      .row {
        max-width: 100%
      }

      .candies {
        min-width: 0;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 22px, #000 calc(100% - 22px), transparent);
        mask-image: linear-gradient(90deg, transparent, #000 22px, #000 calc(100% - 22px), transparent)
      }
    }

    @media (max-width:820px) {
      .row {
        flex-direction: column;
        gap: 6px;
        align-items: stretch;
        width: 100%;
        padding: 0
      }

      .wrap {
        align-self: center
      }

      .strip {
        width: min(78vw, 300px)
      }

      .candies {
        gap: 26px;
        padding: 8px 26px 10px;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 22px, #000 calc(100% - 22px), transparent);
        mask-image: linear-gradient(90deg, transparent, #000 22px, #000 calc(100% - 22px), transparent)
      }

      .dock {
        gap: 7px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom))
      }

      .tool {
        width: 40px;
        height: 40px
      }

      .tools {
        gap: 6px
      }

      .cube {
        width: 25px;
        height: 25px;
        border-radius: 8px
      }

      .cubes {
        gap: 6px
      }
    }

    @media (max-height:480px) {
      .hint {
        display: none
      }

      .candies {
        display: none
      }

      .dock {
        padding-bottom: 6px
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .table.jolt {
        animation: none
      }

      .cube,
      .tool,
      .candy,
      .wrap,
      .hint,
      .tool .ar,
      .tool .zg {
        transition-duration: .01s
      }

      .tool[data-g="2"] .zg circle:nth-child(2) {
        animation: none
      }

      .tool:hover .wig {
        animation: none
      }
    }

    .brand h1{pointer-events:auto;cursor:default}
    .board h1{font-size:26px}
    .board .tool{width:68px;height:68px}.board .tool svg{width:36px;height:36px}
    .board .cube{width:44px;height:44px;border-radius:13px}
    .board .candy{height:68px;padding:0 26px 3px;font-size:28px}
    .board .strip{width:380px;height:62px}.board .strip input{font-size:24px}
    .board .hint{font-size:20px}
    .strip input,.candy{text-transform:none}
    #tp[hidden]{display:none}
    #tp{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9;display:grid;place-items:center;background:rgba(43,16,85,.55)}
    .pc{background:#fff;color:#2B1055;color-scheme:light;border:4px solid #2B1055;border-radius:22px;padding:22px;width:92vw;max-width:560px;box-shadow:0 8px 0 rgba(43,16,85,.35)}
    .pc h2{margin:0 0 6px;font:700 26px var(--round);color:#2B1055}
    .pc p{margin:0 0 12px;font:700 16px var(--round);color:#2B1055;opacity:1}
    .pc textarea{display:block;width:100%;height:240px;-webkit-appearance:none;appearance:none;color-scheme:light;background:#FFF6B8;border:4px solid #2B1055;border-radius:14px;padding:12px;font:700 24px/1.5 var(--round);color:#2B1055;-webkit-text-fill-color:#2B1055;caret-color:#FF2E7E;opacity:1;-webkit-user-select:text;user-select:text}
    .pbtn{border:0;border-radius:14px;padding:12px 18px;margin:12px 10px 0 0;font:700 17px var(--round);background:var(--lime);color:var(--grape);cursor:pointer;box-shadow:inset 0 -4px 0 rgba(43,16,85,.17),0 4px 0 rgba(43,16,85,.32)}
    .pbtn.alt{background:var(--lemon)}
  </style>
</head>

<body>
  <main class="stage" id="stage">
    <div class="table" id="table">
      <canvas id="bg" aria-hidden="true"></canvas>
      <canvas id="fg" role="img"
        aria-label="Ζελεδένια γράμματα σε ένα πιάτο. Γράψε για να πέσουν κι άλλα, σύρε για να τεντωθούν, πάτα για να τα τσιμπήσεις."></canvas>
    </div>

    <header class="bar">
      <div class="brand">
        <h1><span>ζελέ</span><span>αλφάβητο</span></h1>
        <div class="cubes" role="group" aria-label="Flavour">
          <button class="cube" type="button" data-f="0" aria-pressed="false" aria-label="Lemon" title="lemon"></button>
          <button class="cube" type="button" data-f="1" aria-pressed="false" aria-label="Lime" title="lime"></button>
          <button class="cube" type="button" data-f="2" aria-pressed="false" aria-label="Blue raspberry"
            title="blue raspberry"></button>
          <button class="cube" type="button" data-f="3" aria-pressed="false" aria-label="Orange"
            title="orange"></button>
        </div>
      </div>
      <div class="tools">
        <button class="tool" id="grav" type="button" data-g="0" aria-label="Gravity: down" title="gravity">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <g class="ar">
              <path d="M12 4v15" />
              <path d="M5.5 13 12 19.5 18.5 13" />
            </g>
            <g class="zg">
              <circle cx="12" cy="12" r="4.2" />
              <circle cx="12" cy="2.6" r="1.3" fill="currentColor" stroke="none" />
              <path d="M3.5 17.5q8.5 6 17 0" stroke-dasharray="1 4.2" />
            </g>
          </svg>
        </button>
        <button class="tool" id="wob" type="button" aria-label="Wobble the table" title="wobble the table (space)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="wig" d="M4 8q2-3.4 4 0t4 0 4 0 4 0" />
            <ellipse cx="12" cy="16" rx="9" ry="3.4" />
            <path d="M8.5 16.3q3.5 1.4 7 0" stroke-width="1.8" />
          </svg>
        </button>
        <button class="tool" id="brd" type="button" aria-pressed="false" aria-label="Λειτουργία πίνακα" title="λειτουργία πίνακα (πλήρης οθόνη)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="tool" id="snd" type="button" aria-pressed="false" aria-label="Sound: off" title="sound">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke-width="2" />
            <path class="wave" d="M15.5 9.2q2.2 2.8 0 5.6M18.4 6.6q4.2 5.4 0 10.8" />
            <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" />
          </svg>
        </button>
      </div>
    </header>

    <footer class="dock" id="dock">
      <p class="hint" id="hint" aria-live="polite"></p>
      <div class="row">
        <label class="wrap">
          <span class="sr">Γράψε γράμματα για να πέσουν στο πιάτο</span>
          <span class="strip"><input id="field" type="text" inputmode="text" autocomplete="off" autocorrect="off"
              autocapitalize="characters" spellcheck="false" enterkeyhint="done" placeholder="γράψε εδώ"
              maxlength="40"></span>
        </label>
        <div class="candies" id="candies" role="group" aria-label="Sample words">
        </div>
      </div>
    </footer>
  <div id="tp" hidden><div class="pc"><h2>λέξεις της εβδομάδας</h2><p>μία λέξη ανά γραμμή · χώρισε τις συλλαβές με παύλα: μα-μά, θά-λασ-σα</p><textarea id="tpw" spellcheck="false"></textarea><div><button class="pbtn" id="tpsave" type="button">αποθήκευση</button><button class="pbtn alt" id="tpdef" type="button">αρχικές</button><button class="pbtn alt" id="tpx" type="button">κλείσιμο</button></div></div></div>
  </main>

  <script>
    (() => {
      'use strict';

      /* ------------------------------------------------------------------ helpers */
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
      const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
      const WHITE = [255, 255, 255], GRAPE = [43, 16, 85];
      const FLAV = [[255, 225, 77], [124, 255, 107], [61, 165, 255], [255, 138, 31]];

        const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t; acc += dt;
        let nsub = 0; while (acc >= DT && nsub < 5) { step(); acc -= DT; nsub++; }
        if (acc > DT) acc = 0;
        /* flavours ease, impacts speak */
        for (const b of letters) {
          const f = flavourMode < 0 ? b.fi : flavourMode, tc = FLAV[f], td = DEEP[f];
          for (let k = 0; k < 3; k++) { b.col[k] += (tc[k] - b.col[k]) * 0.14; b.deep[k] += (td[k] - b.deep[k]) * 0.14; }
          b.cool -= dt;
          if (b.hit > 300 && b.cool <= 0) { blop(b.s * Math.sqrt(b.g.area), clamp(b.hit / 2600, 0.06, 0.5)); b.cool = 0.11; }
          b.hit = 0;
          /* a letter hung up on its neighbours hops toward its place in the word */
          const off = b.home - b.cmx;
          if (b.homed && !b.transit && !b.grabs && grav !== 2 && !reduced && Math.abs(off) > b.s * 0.3) {
            b.stuck += dt;
            if (b.stuck > 0.75) { b.stuck = 0; shove(b, clamp(off * 2.2, -b.s * 2.5, b.s * 2.5), (grav === 0 ? -1 : 1) * Math.sqrt(2 * G * b.s * 0.42)); }
          } else b.stuck = 0;
        }
        if (hover) { /* letters flinch when the cursor brushes them */
          const hb = pickBody(hover.x, hover.y, 0); fg.style.cursor = hb ? 'grab' : 'default';
          if (hb && hb !== lastHover && !reduced) poke(hb, hover.x, hover.y, 0.32);
          lastHover = hb; hover = null;
        }
        render();
      }
      function start() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
      function stop() { cancelAnimationFrame(raf); raf = 0; }
      document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });

      /* ------------------------------------------------------------------ pointer: drag, stretch, fling, poke */
      function pos(e) { const r = fg.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }; }
      function inBody(b, x, y) {
        if (x < b.minX || x > b.maxX || y < b.minY || y > b.maxY) return false;
        for (const r of b.g.rings) {
          if (r.hole) continue; let c = false;
          for (let j = r.a, k = r.a + r.n - 1; j < r.a + r.n; k = j++) { if ((b.y[j] > y) !== (b.y[k] > y) && x < (b.x[k] - b.x[j]) * (y - b.y[j]) / (b.y[k] - b.y[j]) + b.x[j]) c = !c; }
          if (c) return true;
        }
        return false;
      }
      function pickBody(x, y, slop) {
        for (let i = letters.length - 1; i >= 0; i--) if (inBody(letters[i], x, y)) return letters[i];
        if (slop > 0) {
          let best = slop * slop, bb = null;
          for (const b of letters) for (let i = 0; i < b.n; i++) { const d = (b.x[i] - x) * (b.x[i] - x) + (b.y[i] - y) * (b.y[i] - y); if (d < best) { best = d; bb = b; } }
          return bb;
        }
        return null;
      }
      function dropGrabsOf(b) { for (const [id, gr] of grabs) if (gr.b === b) { grabs.delete(id); } b.grabs = 0; }
      function release(gr, slipped) {
        grabs.delete(gr.id); gr.b.grabs = Math.max(0, gr.b.grabs - 1);
        if (!grabs.size) fg.style.cursor = 'default';
        if (slipped) { blop(gr.b.s * 0.5, 0.12); rings.push({ x: gr.x, y: gr.y, t: 0, r: 26, col: WHITE }); }
      }
      fg.addEventListener('pointerdown', e => {
        if (e.button > 0) return; if (e.pointerType === 'touch' && document.documentElement.classList.contains('board') && Math.max(e.width, e.height) > 150) return;
        const p = pos(e), b = pickBody(p.x, p.y, e.pointerType === 'mouse' ? 0 : 22);
        if (document.activeElement === field && e.pointerType !== 'mouse') field.blur();
        if (!b) {
          rings.push({ x: p.x, y: p.y, t: 0, r: 34, col: WHITE });
          for (const o of letters) if (Math.hypot(o.cmx - p.x, o.cmy - p.y) < o.s * 1.5) poke(o, p.x, p.y, 0.6);
          return;
        }
        try { fg.setPointerCapture(e.pointerId); } catch (err) { }
        const w = new Float32Array(b.n), ox = new Float32Array(b.n), oy = new Float32Array(b.n), rad = b.s * 0.3;
        for (let i = 0; i < b.n; i++) { const dx = b.x[i] - p.x, dy = b.y[i] - p.y; w[i] = Math.exp(-(dx * dx + dy * dy) / (rad * rad)); ox[i] = dx * 0.8; oy[i] = dy * 0.8; }
        grabs.set(e.pointerId, { id: e.pointerId, b, x: p.x, y: p.y, sx: p.x, sy: p.y, t: performance.now(), moved: false, w, ox, oy });
        b.grabs++; fg.style.cursor = 'grabbing';
        poke(b, p.x, p.y, 0.35);
      });
      fg.addEventListener('pointermove', e => {
        const p = pos(e), gr = grabs.get(e.pointerId);
        if (!gr) { if (e.pointerType === 'mouse') hover = p; return; }
        gr.x = p.x; gr.y = p.y;
        if (!gr.moved && Math.hypot(p.x - gr.sx, p.y - gr.sy) > 7) { gr.moved = true; gr.b.homed = false; hideHintOnce(); }
      });
      const endPointer = e => {
        const gr = grabs.get(e.pointerId); if (!gr) return;
        const b = gr.b; release(gr, false);
        if (!gr.moved && performance.now() - gr.t < 420) {
          poke(b, gr.x, gr.y, 1.25); rings.push({ x: gr.x, y: gr.y, t: 0, r: b.s * 0.3, col: WHITE });
          blop(b.s * Math.sqrt(b.g.area) * 0.8, 0.22); hideHintOnce(); tapSyl(b);
        }
      };
      fg.addEventListener('pointerup', endPointer);
      fg.addEventListener('pointercancel', endPointer);
      fg.addEventListener('lostpointercapture', endPointer);
      fg.addEventListener('contextmenu', e => e.preventDefault());

      /* ------------------------------------------------------------------ keyboard + candy-wrapper field */
      let composing = false;
      addEventListener('keydown', e => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const t = e.target, inField = t === field; if (t && t.tagName === 'TEXTAREA') return;
        if (e.key === ' ' || e.code === 'Space') { if (t && t.tagName === 'BUTTON') return; e.preventDefault(); jolt(); return; }
        if (inField) { if (e.key === 'Enter' || e.key === 'Escape') field.blur(); return; }
        if (e.key === 'Backspace') { e.preventDefault(); cancelQueue(); removeLast(); }
        else if (e.key === 'Delete' || e.key === 'Escape') { cancelQueue(); clearAll(); }
        else if (e.key.length === 1) { const ch = norm(e.key); if (GLYPH[ch]) { e.preventDefault(); cancelQueue(); addLetter(ch); typed(); } }
      });
      field.addEventListener('compositionstart', () => { composing = true; });
      field.addEventListener('compositionend', () => { composing = false; fieldChanged(); });
      field.addEventListener('input', () => { if (!composing) fieldChanged(); });
      function fieldChanged() {
        const cur = letters.map(b => b.ch).join('');
        const raw = norm(field.value);
        if (/\s/.test(raw)) jolt();
        const v = [...raw].filter(ch => GLYPH[ch]).join('');
        let p = 0; while (p < v.length && p < cur.length && v[p] === cur[p]) p++;
        cancelQueue();
        for (let k = cur.length; k > p; k--) removeLast();
        for (let k = p; k < v.length; k++) addLetter(v[k]);
        if (v.length > p) typed();
        syncField();
      }
      document.getElementById('candies').addEventListener('click', e => {
        const c = e.target.closest('.candy'); if (!c) return;
        pendSyl = c.dataset.st ? c.dataset.st.split('-') : null; setWord(c.dataset.w, 0.12); if (e.detail > 0) c.blur();
      });

      /* ------------------------------------------------------------------ controls */
      const cubes = [...document.querySelectorAll('.cube')];
      cubes.forEach(c => c.addEventListener('click', e => {
        const f = +c.dataset.f; flavourMode = flavourMode === f ? -1 : f;
        cubes.forEach(o => o.setAttribute('aria-pressed', String(+o.dataset.f === flavourMode)));
        for (const b of letters) poke(b, b.cmx, b.cmy + b.s * 0.3, 0.5);
        say(flavourMode < 0 ? 'ανάμεικτα' : 'όλα ' + FNAME[f]);
        if (e.detail > 0) c.blur();
      }));
      const gravBtn = document.getElementById('grav'), GN = ['κάτω', 'ανάποδα', 'χωρίς βάρος'];
      gravBtn.addEventListener('click', e => {
        grav = (grav + 1) % 3; gravBtn.dataset.g = grav; gravBtn.setAttribute('aria-label', 'Gravity: ' + GN[grav]);
        say('βαρύτητα: ' + GN[grav]);
        for (const b of letters) {
          if (reduced) { place(b); continue; }
          if (grav === 2) { const a = Math.random() * 6.28; shove(b, Math.cos(a) * 90, Math.sin(a) * 90 - 60); spin(b, (Math.random() - 0.5) * 1.6); }
        }
        if (e.detail > 0) gravBtn.blur();
      });
      document.getElementById('wob').addEventListener('click', e => { jolt(); if (e.detail > 0) e.currentTarget.blur(); });

      /* ------------------------------------------------------------------ sound (off until asked for) */
      let actx = null, master = null, soundOn = false, lastBlop = 0;
      const sndBtn = document.getElementById('snd');
      sndBtn.addEventListener('click', e => {
        soundOn = !soundOn;
        if (soundOn && !actx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) { actx = new AC(); master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination); } else soundOn = false;
        }
        if (actx && soundOn && actx.state === 'suspended') actx.resume();
        sndBtn.setAttribute('aria-pressed', String(soundOn)); sndBtn.setAttribute('aria-label', 'Sound: ' + (soundOn ? 'on' : 'off'));
        say(soundOn ? 'ήχος: ανοιχτός' : 'ήχος: κλειστός');
        if (soundOn) blop(120, 0.3);
        if (e.detail > 0) sndBtn.blur();
      });
      function tone(f0, f1, f2, dur, vol, type) {
        if (!soundOn || !actx) return;
        const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.28); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
      }
      function blop(size, vol) { /* bigger jellies blop lower */
        if (!soundOn || !actx) return; const now = performance.now(); if (now - lastBlop < 28) return; lastBlop = now;
        const f = clamp(640 - size * 1.7, 150, 640) * (0.92 + Math.random() * 0.16);
        tone(f * 0.6, f * 1.45, f * 0.7, 0.2, vol, 'sine');
      }
      function sfxPop(size) { const f = clamp(900 - size * 2, 380, 900); tone(f * 1.6, f, f * 0.35, 0.16, 0.3, 'triangle'); }
      function sfxSlurp() { tone(180, 420, 1100, 0.34, 0.16, 'sine'); }
      function sfxThud() { tone(150, 90, 55, 0.24, 0.4, 'sine'); }

      /* ------------------------------------------------------------------ the small type */
      const HINT = '<i></i>γράψε κάτι. μετά τσίμπα το.';
      let hintTimer = 0, hintUsed = 0, hintReady = false;
      function say(text) {
        hintEl.textContent = text; hintEl.classList.remove('on'); void hintEl.offsetWidth; hintEl.classList.add('on');
        clearTimeout(hintTimer); hintTimer = setTimeout(() => { hintEl.classList.remove('on'); setTimeout(restoreHint, 320); }, 1700);
      }
      function restoreHint() { if (!hintReady) return; hintEl.innerHTML = hintUsed >= 2 ? '<i></i>το space τραντάζει το τραπέζι. το backspace σκάει το γράμμα.' : HINT; hintEl.classList.add('on'); }
      function typed() { if (hintUsed < 1) hintUsed = 1; }
      function hideHintOnce() { if (hintUsed === 1) { hintUsed = 2; if (hintReady && hintEl.classList.contains('on') && !hintTimer) restoreHint(); else if (hintReady) { hintEl.classList.remove('on'); setTimeout(restoreHint, 320); } } }

      /* ------------------------------------------------------------------ teacher words + board mode */
      const DEF = ['ΑΒΓ', 'μαμά', 'μπάλα', 'ζελέ', 'ψάρι', 'ήλιος', 'σχολείο', 'μπουμ!'];
      const cand = document.getElementById('candies'), tp = document.getElementById('tp'), ta = document.getElementById('tpw');
      const clean = x => [...norm(x).replace(/([\u03ac-\u03ce])\u03c3(?![\u03ac-\u03ce-])/g, '$1\u03c2')].filter(c => GLYPH[c]).join('').slice(0, CAP);
      function loadWords() { let w = null; try { w = JSON.parse(localStorage.getItem('jelly.words')); } catch (er) { } return Array.isArray(w) && w.length ? w : null; }
      function renderWords(list) { cand.innerHTML = ''; list.forEach(w => { const b = document.createElement('button'); b.type = 'button'; b.className = 'candy'; const pt = clean(w).split('-').filter(Boolean); b.dataset.w = pt.join(''); if (pt.length > 1) b.dataset.st = pt.join('-'); b.textContent = w; cand.appendChild(b); }); }
      DEF.splice(0, DEF.length, '\u0391\u03b1', 'Μαμά', 'μπάλα', 'ζελέ', 'ψάρι', 'ήλιος', 'σχολείο', 'Μπουμ!');
      renderWords(loadWords() || DEF);
      let lp = 0; const h1 = document.querySelector('h1');
      h1.addEventListener('pointerdown', () => { clearTimeout(lp); lp = setTimeout(() => { ta.value = (loadWords() || DEF).join('\n'); tp.hidden = false; ta.focus(); }, 1200); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => h1.addEventListener(t, () => clearTimeout(lp)));
      h1.addEventListener('contextmenu', e => e.preventDefault());
      document.getElementById('tpsave').onclick = () => {
        const l = ta.value.split(/[\n,;]+/).map(x => x.trim()).filter(x => clean(x)).slice(0, 24);
        try { if (l.length) localStorage.setItem('jelly.words', JSON.stringify(l)); } catch (er) { }
        renderWords(l.length ? l : DEF); tp.hidden = true; say(l.length ? 'οι λέξεις αποθηκεύτηκαν' : 'αρχικές λέξεις');
      };
      document.getElementById('tpdef').onclick = () => { try { localStorage.removeItem('jelly.words'); } catch (er) { } ta.value = DEF.join('\n'); };
      document.getElementById('tpx').onclick = () => { tp.hidden = true; };
      if (!loadWords()) { DEF.splice(0, DEF.length, 'Αα', 'μα-μά', 'μπά-λα', 'ζε-λέ', 'ψά-ρι', 'ή-λιος', 'σχο-λεί-ο', 'θά-λασ-σα'); renderWords(DEF); }
      function tapSyl(b) {
        if (!curSyl || b.si == null) return;
        const f = [262, 294, 330, 392, 440, 523][b.si % 6]; tone(f, f, f * 0.98, 0.35, 0.28, 'triangle');
        letters.forEach(o => { if (o !== b && o.si === b.si) poke(o, o.cmx, o.cmy, 0.8); });
      }
      const brd = document.getElementById('brd'); let wl = null;
      brd.addEventListener('click', e => {
        const d = document.documentElement, on = !d.classList.contains('board');
        d.classList.toggle('board', on); brd.setAttribute('aria-pressed', String(on));
        try {
          if (on) { (d.requestFullscreen || d.webkitRequestFullscreen || function () { }).call(d); if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { wl = l; }, () => { }); }
          else { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); if (wl) { wl.release(); wl = null; } }
        } catch (er) { }
        say(on ? 'λειτουργία πίνακα' : 'κανονική οθόνη'); setTimeout(onResize, 150); if (e.detail > 0) brd.blur();
      });

      /* ------------------------------------------------------------------ boot */
      let resizeT = 0;
      function onResize() {
        measure(); layout();
        for (const b of letters) {
          const room = rooms[b.room];
          if (reduced) { place(b); continue; }
          if (!b.transit && (b.maxY < room.top || b.minY > room.floor)) { b.transit = true; b.tt = 0; }
          b.s = Math.min(b.s, b.ts * 1.4);
        }
      }
      addEventListener('resize', () => { cancelAnimationFrame(resizeT); resizeT = requestAnimationFrame(onResize); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { cancelAnimationFrame(resizeT); resizeT = requestAnimationFrame(onResize); });
      const onMq = () => { reduced = mq.matches; };
      if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);

      measure();
      planned = [...'ΑΒΓ'];
      planned.forEach((ch, i) => queue.push({ at: 0.18 + i * (reduced ? 0.04 : 0.22), fn: () => { planned.shift(); addLetter(ch); } }));
      setTimeout(() => { hintReady = true; restoreHint(); }, reduced ? 900 : 3000);
      if (!document.hidden) start();
    })();
  </script>
